openapi: 3.0.3
info:
  title: Command Center auth-server
  version: 0.1.0
  description: |
    Username/password self-register, login, and token issuance for Command Center desktop.
    A device server (this computer only) may store source passwords and API keys at /vault.
    A shared server, for other devices, does not. Board documents still reject secret values.
    /admin is a separate server-admin sign-in for server settings. It is not a board login,
    and a board token is rejected there. The server admin token is rejected by /auth/me.
servers:
  - url: https://auth-server.local:8443
    description: LAN auth-server (example hostname)
paths:
  /health:
    get:
      summary: Liveness
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /vault:
    get:
      summary: Read source passwords and API keys for the signed-in user
      description: Only when this server is device-only and secret storage is on. Otherwise 403.
      operationId: readVault
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stored secrets for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    put:
      summary: Replace source passwords and API keys for the signed-in user
      description: Session tokens are rejected. A shared server always returns 403.
      operationId: writeVault
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Vault"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /auth/register:
    post:
      summary: Self-register (primary signup from Command Center)
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Created user + token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      summary: Login with username and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /auth/refresh:
    post:
      summary: Rotate refresh token and issue a new access token
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      summary: Revoke a refresh token
      operationId: logout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Revoked (or already gone)
  /auth/me:
    get:
      summary: Current user from access token
      operationId: me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
  /settings:
    get:
      summary: Board and source setup for the signed-in user
      operationId: getSettings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stored document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsDocument"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      summary: Replace the signed-in user's board document
      description: |
        `revision` is the last revision this client saved, or null to create.
        A mismatch returns 409 with the current document. Secret values are rejected;
        the `secrets` array may list key names only.
      operationId: putSettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutSettingsRequest"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsDocument"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Revision conflict; body is the current document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsConflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    Vault:
      type: object
      required: [secrets]
      properties:
        secrets:
          type: object
          additionalProperties:
            type: string
          description: Source secret name to value. Not the account password, and not session tokens.
    HealthResponse:
      type: object
      required: [ok, service]
      properties:
        ok:
          type: boolean
        service:
          type: string
          example: auth-server
        mode:
          type: string
          enum: [device, shared]
          description: device is this computer only. shared is a server other devices can use.
        secretStore:
          type: boolean
          description: True only when mode is device and secret storage was turned on.
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Access token lifetime in seconds
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_credentials
            - invalid_token
            - rate_limited
            - username_taken
            - weak_password
            - registration_disabled
            - bad_request
            - not_found
            - conflict
            - secret_store_disabled
            - internal
    SettingsDocument:
      type: object
      required: [revision, updatedAt, document]
      properties:
        revision:
          type: integer
        updatedAt:
          type: integer
          description: Unix seconds
        document:
          type: object
          description: Board, layout, and source setup. No secret values.
    PutSettingsRequest:
      type: object
      required: [document]
      properties:
        revision:
          type: integer
          nullable: true
        document:
          type: object
    SettingsConflict:
      allOf:
        - $ref: "#/components/schemas/SettingsDocument"
        - type: object
          required: [error]
          properties:
            error:
              type: string
              enum: [conflict]
