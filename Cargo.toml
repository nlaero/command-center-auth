[package]
name = "auth-server"
version = "0.1.0"
edition = "2021"
description = "Command Center auth-server — username/password login and tokens"
license = "MIT"
default-run = "auth-server"

[[bin]]
name = "auth-server"
path = "src/main.rs"

[[bin]]
name = "authctl"
path = "src/bin/authctl.rs"

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
hex = "0.4"
jsonwebtoken = "9"
password-hash = "0.5"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
